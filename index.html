<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CasaEase Madrid | Your Local Flat Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    /* Warm, modern, Gen-Z / Millennial Palette */
    --bg-main: #FAF9F6;
    --bg-card: #FFFFFF;
    --text-dark: #1A1A1A;
    --text-muted: #595959;
    --brand-coral: #E85D45;
    --brand-coral-hover: #D14D36;
    --brand-olive: #344C41;
    --brand-sand: #F2EFE9;
    --radius-md: 16px;
    --radius-lg: 32px;
    --shadow-soft: 0 12px 32px -8px rgba(0, 0, 0, 0.06);
    --shadow-hover: 0 20px 40px -10px rgba(0, 0, 0, 0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: var(--bg-main);
    color: var(--text-dark);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  h1, h2, h3, h4 {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    line-height: 1.15;
    color: var(--brand-olive);
  }

  a { text-decoration: none; color: inherit; }
  ul { list-style: none; }
  img { max-width: 100%; display: block; border-radius: var(--radius-md); object-fit: cover; }

  /* Container */
  .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

  /* Buttons */
  .btn {
    display: inline-flex; justify-content: center; align-items: center;
    padding: 16px 32px; border-radius: 99px;
    font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 1.1rem;
    cursor: pointer; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    border: none; text-align: center;
  }
  .btn-primary {
    background-color: var(--brand-coral); color: #fff;
    box-shadow: 0 8px 24px rgba(232, 93, 69, 0.3);
  }
  .btn-primary:hover {
    background-color: var(--brand-coral-hover); transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(232, 93, 69, 0.4);
  }
  .btn-outline {
    background-color: transparent; border: 2px solid var(--brand-olive);
    color: var(--brand-olive);
  }
  .btn-outline:hover {
    background-color: var(--brand-olive); color: #fff;
  }

  /* Header */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(250, 249, 246, 0.85);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: 16px 0; border-bottom: 1px solid rgba(0,0,0,0.05);
  }
  .nav-flex { display: flex; justify-content: space-between; align-items: center; }
  .logo { font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 800; color: var(--brand-olive); }
  .logo span { color: var(--brand-coral); }
  .nav-links { display: flex; gap: 32px; align-items: center; }
  .nav-links a { font-weight: 600; font-size: 1rem; color: var(--text-dark); transition: color 0.2s; }
  .nav-links a:hover { color: var(--brand-coral); }
  @media (max-width: 768px) { .nav-links { display: none; } }

  /* Hero Section */
  .hero { padding: 160px 0 80px; }
  .hero-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 64px; align-items: center; }
  .hero-content h1 { font-size: clamp(3rem, 5vw, 4.5rem); margin-bottom: 24px; letter-spacing: -0.02em; }
  .hero-content p { font-size: 1.25rem; color: var(--text-muted); margin-bottom: 40px; max-width: 90%; }
  
  .search-box {
    display: flex; gap: 8px; background: #fff; padding: 8px;
    border-radius: 99px; box-shadow: var(--shadow-soft);
    border: 1px solid rgba(0,0,0,0.05);
  }
  .search-box input {
    flex: 1; border: none; background: transparent; padding: 0 24px;
    font-family: inherit; font-size: 1rem; outline: none;
  }
  .hero-image { position: relative; }
  .hero-image img { height: 600px; width: 100%; border-radius: var(--radius-lg); }
  
  .chat-badge {
    position: absolute; bottom: 40px; left: -40px;
    background: #fff; padding: 20px 24px; border-radius: 24px 24px 24px 4px;
    box-shadow: var(--shadow-hover); max-width: 280px;
    animation: float 4s ease-in-out infinite;
  }
  .chat-badge p { font-size: 0.95rem; font-weight: 500; color: var(--text-dark); line-height: 1.4; margin: 0; }
  .chat-badge span { display: block; font-size: 0.8rem; color: var(--text-muted); margin-top: 8px; }
  @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }

  @media (max-width: 968px) {
    .hero-grid { grid-template-columns: 1fr; gap: 40px; }
    .hero-image img { height: 400px; }
    .chat-badge { left: 20px; bottom: 20px; }
  }

  /* Identity / Mission Section */
  .mission { padding: 60px 0; text-align: center; }
  .mission-box {
    background: #fff; border-radius: var(--radius-md);
    padding: 40px; box-shadow: var(--shadow-soft);
    max-width: 800px; margin: 0 auto;
    border-left: 4px solid var(--brand-coral);
  }
  .mission-box h3 { font-size: 1.5rem; margin-bottom: 12px; }
  .mission-box p { font-size: 1.1rem; color: var(--text-muted); }

  /* Vibes Section */
  .vibes { padding: 100px 0; background-color: var(--brand-sand); border-radius: var(--radius-lg); margin: 0 24px; }
  .vibes-header { text-align: center; max-width: 600px; margin: 0 auto 64px; }
  .vibes-header h2 { font-size: clamp(2.5rem, 4vw, 3.5rem); margin-bottom: 16px; }
  .vibes-header p { font-size: 1.15rem; color: var(--text-muted); }
  
  .vibes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 32px; padding: 0 40px; }
  .vibe-card { background: #fff; padding: 40px 32px; border-radius: var(--radius-md); box-shadow: var(--shadow-soft); text-align: center; transition: transform 0.3s; }
  .vibe-card:hover { transform: translateY(-5px); }
  .vibe-icon { font-size: 3rem; margin-bottom: 24px; }
  .vibe-card h3 { font-size: 1.5rem; margin-bottom: 12px; }
  .vibe-card p { color: var(--text-muted); font-size: 1rem; }

  /* Steps Section */
  .steps-section { padding: 120px 0; }
  .steps-header { text-align: center; margin-bottom: 80px; }
  .steps-header h2 { font-size: clamp(2.5rem, 4vw, 3.5rem); }
  
  .steps-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; }
  .steps-list { display: flex; flex-direction: column; gap: 40px; }
  .step-item { display: flex; gap: 24px; align-items: flex-start; }
  .step-num { 
    background: var(--brand-coral); color: #fff; width: 48px; height: 48px; 
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-family: 'Outfit'; font-size: 1.5rem; font-weight: 700; flex-shrink: 0;
  }
  .step-text h3 { font-size: 1.5rem; margin-bottom: 8px; }
  .step-text p { color: var(--text-muted); font-size: 1.1rem; }
  .steps-image img { height: 600px; border-radius: var(--radius-lg); }

  @media (max-width: 968px) {
    .steps-grid { grid-template-columns: 1fr; }
    .steps-image { order: -1; }
    .steps-image img { height: 400px; }
  }

  /* Pricing */
  .pricing { padding: 100px 0; background: var(--brand-olive); color: #fff; border-radius: var(--radius-lg); margin: 0 24px 100px; }
  .pricing-header { text-align: center; margin-bottom: 64px; }
  .pricing-header h2 { color: #fff; font-size: clamp(2.5rem, 4vw, 3.5rem); margin-bottom: 16px; }
  
  .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 32px; max-width: 1000px; margin: 0 auto; padding: 0 24px; }
  .price-card { background: #fff; color: var(--text-dark); padding: 48px 40px; border-radius: var(--radius-md); position: relative; }
  .price-card.featured { transform: scale(1.05); border: 4px solid var(--brand-coral); }
  .badge { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); background: var(--brand-coral); color: #fff; padding: 6px 16px; border-radius: 99px; font-weight: 700; font-size: 0.9rem; letter-spacing: 0.05em; text-transform: uppercase; }
  
  .price-card h3 { font-size: 1.8rem; margin-bottom: 8px; color: var(--text-dark); }
  .price-card p { color: var(--text-muted); margin-bottom: 24px; }
  .price-amount { font-family: 'Outfit'; font-size: 3.5rem; font-weight: 800; margin-bottom: 32px; color: var(--brand-olive); }
  .price-amount span { font-size: 1.2rem; font-weight: 500; color: var(--text-muted); }
  
  .price-card ul { margin-bottom: 40px; display: flex; flex-direction: column; gap: 16px; }
  .price-card li { display: flex; gap: 12px; align-items: flex-start; font-size: 1.05rem; }
  .price-card li::before { content: "✓"; color: var(--brand-coral); font-weight: 800; }
  .price-card .btn { width: 100%; }
  
  @media (max-width: 968px) { .price-card.featured { transform: scale(1); } }

  /* FAQ Section */
  .faq-section { padding: 0 0 100px; }
  .faq-header { text-align: center; margin-bottom: 48px; }
  .faq-header h2 { font-size: clamp(2.5rem, 4vw, 3.5rem); margin-bottom: 16px; }
  
  .faq-list { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  details { background: #fff; border-radius: var(--radius-md); box-shadow: var(--shadow-soft); padding: 24px; transition: background 0.3s; }
  details[open] { background: var(--brand-sand); }
  summary { font-family: 'Outfit'; font-size: 1.25rem; font-weight: 600; color: var(--brand-olive); cursor: pointer;
